[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tark-studio-backend"
version = "0.1.0"
description = "TARK Studio — Local-First AI Workspace Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TARK Engineering" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "groq>=0.13.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "ollama>=0.4.0",
    "google-genai>=1.0.0",
    "PyMuPDF>=1.24.0",
    "onnxruntime>=1.18.0",
    "numpy>=1.26.0",
    "tokenizers>=0.19.0",
    "transformers>=4.40.0",
    "tiktoken>=0.7.0",
    "huggingface-hub>=0.23.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py312"
